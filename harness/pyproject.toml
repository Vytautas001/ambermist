[project]
name = "redcell"
version = "0.1.0"
description = "AI adversary-simulation harness for Blue vs Red cyber defence exercises"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  # tenacity is optional; a stdlib fallback is used if absent (see client.py)
  "pyyaml>=6.0",
  "rich>=13.7",
]

[project.optional-dependencies]
retry = ["tenacity>=8.3"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21"]

[project.scripts]
redcell = "redcell.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redcell = ["prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
