# Copy to exercise.yaml and fill in for your exercise. exercise.yaml is NOT
# gitignored by default — it is exercise configuration, not a secret — but keep
# real scope details out of a public remote.

endpoint:
  base_url: http://router.exercise.local:4000/v1
  model: redcell-adversary
  # api_key comes from $REDCELL_API_KEY

sampling:
  temperature: 0.7
  max_tokens: 2048
  include_reasoning_in_audit: true

exercise:
  name: AMBERMIST-2026
  scenario_id: SCN-014
  threat_actor_profile: financially-motivated ransomware affiliate, mid-sophistication
  authorising_officer: "<name, role>"
  authorisation_ref: "<exercise authorisation reference>"
  in_scope_networks:
    - "10.20.0.0/16   # exercise range only"
  in_scope_systems:
    - "range DC, file servers, workstations in 10.20.x.x"
  out_of_scope:
    - "any host outside 10.20.0.0/16"
    - "exercise control / White Cell infrastructure"
    - "the internet"

teams:
  - {team_id: blue-team-01, display_name: "Blue Team 1"}
  - {team_id: blue-team-02, display_name: "Blue Team 2"}
  - {team_id: blue-team-03, display_name: "Blue Team 3"}
  - {team_id: blue-team-04, display_name: "Blue Team 4"}
  - {team_id: blue-team-05, display_name: "Blue Team 5"}
  - {team_id: blue-team-06, display_name: "Blue Team 6"}
  - {team_id: blue-team-07, display_name: "Blue Team 7"}
  - {team_id: blue-team-08, display_name: "Blue Team 8"}

audit_dir: audit
