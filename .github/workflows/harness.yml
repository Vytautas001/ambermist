name: harness
on:
  pull_request:
    paths: ["harness/**", "evals/**"]
  push:
    branches: [main]
    paths: ["harness/**", "evals/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: harness } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
