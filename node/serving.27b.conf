MODEL_PATH=/srv/models/qwen38-27b-uncensored-q4km/Qwen3.8-27B-Uncensored-Q4_K_M.gguf
LLAMA_ALIAS=reasoner
LLAMA_CTX=262144
LLAMA_SLOTS=2
LLAMA_HOST=127.0.0.1
LLAMA_PORT=8081
LLAMA_EXTRA_ARGS="--temp 1.0 --top-k 20 --top-p 0.95 --min-p 0 --presence-penalty 1.5"
# Per-slot context is LLAMA_CTX / LLAMA_SLOTS = 131072 tokens (prompt + reasoning + answer
# together), not LLAMA_CTX itself. 2 slots rather than 4 so one long agent turn doesn't queue
# behind VS Code's own side requests, while still giving ~16 GiB of KV in total (confirmed:
# GGUF context_length = 262144, so 131072/slot is within the model's trained range).
# LLAMA_EXTRA_ARGS sets llama.cpp's request defaults to the Qwen3.8-27B model card's
# thinking-mode sampling (temperature 1.0, top_p 0.95, top_k 20, min_p 0.0; card default
# presence_penalty is 0.0, read 2026-10-04). presence_penalty is raised here per
# docs/27b-agent-loop.md step 5 (card allows up to 2.0; values above 1.5 may cause language
# mixing), because the loop persisted with prompts well under the slot size and requests
# ending normally. 1.0 was tried first and did not stop a single-turn 16,861-token runaway
# generation (2026-10-04); now at 1.5, the step's ceiling — if it still loops here, the doc
# says put this back to 0 and stop, not go higher. These defaults only apply when a client
# sends no sampling of its own; VS Code's agent mode has been observed sending temperature
# 0.1 on its own requests, which overrides this (docs/27b-agent-loop.md, LESSONS.md dated
# section).
# The value must stay quoted: bootstrap.sh sources this file with bash, where an unquoted
# value with spaces fails under `set -e`, and the service's unbraced $LLAMA_EXTRA_ARGS in
# ExecStart splits an unquoted value into separate arguments (LESSONS.md, Phases 2 and 3).
# Change slots/ctx here only, never in the flash profile.
